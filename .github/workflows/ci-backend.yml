name: Backend CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "backend/pyproject.toml"
      - ".github/workflows/ci-backend.yml"
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "backend/pyproject.toml"
      - ".github/workflows/ci-backend.yml"

permissions:
  contents: read

jobs:
  backend:
    name: Lint, type-check, test, and migrate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: unilake
          POSTGRES_PASSWORD: unilake
          POSTGRES_DB: unilake
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: unilake
      DB_PASSWORD: unilake
      DB_NAME: unilake
      JWT_SECRET_KEY: ci-secret
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: python -m pip install -e "backend[dev]"

      - name: Lint
        run: ruff check backend

      - name: Format check
        run: ruff format backend --check

      - name: Type check
        run: mypy --config-file backend/pyproject.toml backend/app

      - name: Test migrations
        run: cd backend && alembic upgrade head

      - name: Tests
        run: cd backend && pytest
