name: unilake-ai

services:
  # ============================================================================
  # 1. PostgreSQL Database (Structured Data & App DB)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: unilake-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-unilake}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-unilake}
      POSTGRES_DB: ${DB_NAME:-unilake}
      DB_READONLY_USER: ${DB_READONLY_USER:-unilake_reader}
      DB_READONLY_PASSWORD: ${DB_READONLY_PASSWORD:-unilake_reader}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-5000}
      DB_SOURCE_NAME: ${DB_SOURCE_NAME:-unilake_source}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./infra/postgres/seed:/opt/seed/scripts:ro
      - ./docs/data-schema:/opt/seed/ddl:ro
      - ./data/samples:/opt/seed/data:ro
    networks:
      - unilake-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-unilake} -d ${DB_NAME:-unilake}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ============================================================================
  # 2. MinIO Object Storage (Raw & Data Lake Bronze/Silver/Gold)
  # ============================================================================
  minio:
    image: elestio/minio:latest
    container_name: unilake-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - unilake-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ============================================================================
  # 2b. MinIO Auto Bucket Initializer (Bronze, Silver, Gold)
  # ============================================================================
  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    container_name: unilake-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      BRONZE: ${MINIO_BUCKET_BRONZE:-bronze}
      SILVER: ${MINIO_BUCKET_SILVER:-silver}
      GOLD: ${MINIO_BUCKET_GOLD:-gold}
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD && mc mb --ignore-existing local/$$BRONZE local/$$SILVER local/$$GOLD && mc version enable local/$$BRONZE && mc ls local"
    restart: "no"
    networks:
      - unilake-network

  # ============================================================================
  # 3. Redis Cache & Task Queue
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: unilake-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - unilake-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 4. Backend Service (FastAPI & DuckDB Processing Engine)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: unilake-backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-true}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-unilake}
      - DB_PASSWORD=${DB_PASSWORD:-unilake}
      - DB_NAME=${DB_NAME:-unilake}
      - DB_READONLY_USER=${DB_READONLY_USER:-unilake_reader}
      - DB_READONLY_PASSWORD=${DB_READONLY_PASSWORD:-unilake_reader}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_SECURE=${MINIO_SECURE:-false}
      - MINIO_BUCKET_BRONZE=${MINIO_BUCKET_BRONZE:-bronze}
      - MINIO_BUCKET_SILVER=${MINIO_BUCKET_SILVER:-silver}
      - MINIO_BUCKET_GOLD=${MINIO_BUCKET_GOLD:-gold}
      - DUCKDB_PATH=${DUCKDB_PATH:-:memory:}
      - DUCKDB_THREADS=${DUCKDB_THREADS:-4}
      - DUCKDB_MEMORY_LIMIT=${DUCKDB_MEMORY_LIMIT:-2GB}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production-use-openssl-rand-hex-32}
    networks:
      - unilake-network
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============================================================================
  # 5. Frontend Service (Next.js)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: unilake-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    networks:
      - unilake-network
    depends_on:
      - backend

# ============================================================================
# Networks & Persistent Volumes
# ============================================================================
networks:
  unilake-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  redis_data:
